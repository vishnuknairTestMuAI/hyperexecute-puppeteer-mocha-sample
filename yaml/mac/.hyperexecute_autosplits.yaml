version: 0.1

runson: mac

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

autosplit: true

retryOnFailure: true
maxRetries: 1
concurrency: 2

pre:
  - npm install

cacheKey: '{{ checksum "package.json" }}'
cacheDirectories:
  - node_modules

testDiscovery:
  type: raw
  mode: remote
  command: grep -lr 'describe' specs/*.spec.js

testRunnerCommand: npm test $test

jobLabel: [puppeteer-Mocha, mac, autosplit]