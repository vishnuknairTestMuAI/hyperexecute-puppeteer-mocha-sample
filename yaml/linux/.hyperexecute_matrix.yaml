---
version: '0.1'

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

matrix:
  os: [linux]
  files: ["specs/google.spec.js","specs/lt.spec.js"]

runson: ${matrix.os}

pre:
  # clear the stale Chrome profile lock left in the VM image
  - rm -f ~/.config/google-chrome/Singleton*
  - npm install

cacheKey: '{{ checksum "package.json" }}'
cacheDirectories:
  - node_modules

testSuites:
  - npm test -- $files

jobLabel: [puppeteer-Mocha, linux, matrix]